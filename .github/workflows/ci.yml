name: CI

# Every push and PR: frontend type-check + build + unit tests, static-data validation, and
# the Spring Boot suite. Deploy (deploy.yml) is separate and stays frontend-only.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (tsc, vite, vitest, data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate static game data
        run: npm run validate-data

      - name: Type-check + build
        run: npm run build

      - name: Unit tests
        run: npm test

  server:
    name: Server (gradle test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # The repo ships only gradlew.bat; the action installs the wrapper's Gradle version
      # (gradle/wrapper/gradle-wrapper.properties) and caches it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Tests
        run: gradle test --no-daemon --console=plain

      - name: Test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-report
          path: server/build/reports/tests/test
          if-no-files-found: ignore
