spring:
  datasource:
    url: jdbc:h2:file:./data/steelmight-db;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      # Off by default — the console allows arbitrary SQL and must never be reachable
      # through a tunnel. Set H2_CONSOLE=true only for local, non-exposed inspection.
      enabled: ${H2_CONSOLE:false}
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
