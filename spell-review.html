t be triggered by another instance of Intercept (chain redirection is not allowed). A projectile attack is any ranged weapon attack or spell attack that travels through space and targets a creature directly.","tags":["defense"]},{"id":"marking-strike","name":"Marking strike","classId":"guardian","cls":"Guardian","path":"Warrior","level":1,"ap":2,"mana":5,"range":null,"duration":"1 min","mech":"5d4 true","desc":"You brand your enemy with a visible combat mark, exposing an opening that allies can exploit to either strike harder or draw strength from the blow. When you make an attack, you may apply Marking Strike after rolling and knowing the outcome. The target becomes marked. When an ally other than you makes a weapon attack against the marked target, they may consume the mark to either heal themselves for [5d4] or deal [5d4] additional damage of the weapon’s type. The mark expires at the end of the ...","tags":["damage","healing","buff"]},{"id":"mend-metal","name":"Mend metal","classId":"guardian","cls":"Guardian","path":"Warrior","level":1,"ap":1,"mana":5,"range":"melee","duration":null,"mech":"channeling","desc":"You channel restorative magic through your hands, bending and sealing damaged materials back into functional shape. You repair an object made of metal or wood that fits within a 4 ft side cube.","tags":["utility"]},{"id":"provoke","name":"Provoke","classId":"guardian","cls":"Guardian","path":"Warrior","level":1,"ap":1,"mana":1,"range":"10 ft","duration":null,"mech":"","desc":"You unleash a focused surge of hostile intent, magically locking the creature’s attention onto you and daring it to strike. You apply [1 taunted stack] to a creature within range. This spell can be recast on the same turn on targets that are not Taunted / do not have enough stacks to become taunted at the start of their turn.","tags":["control"]},{"id":"renewal-membrane","name":"Renewal membrane","classId":"guardian","cls":"Guardian","path":"Warrior","level":1,"ap":3,"mana":10,"range":null,"duration":"1 min","mech":"heals 2d4 + 2 + mod","desc":"You wrap yourself in a living barrier of magic that absorbs harm and continuously knits your wounds as long as it remains intact. You gain [spell modifier + 10] temporary HP. At the end of each of your turns, if you still have any of this temporary HP, you heal for [spell modifier + 2 + 2d4].","tags":["healing","defense"]},{"id":"thorny-shell","name":"Thorny shell","classId":"guardian","cls":"Guardian","path":"Warrior","level":1,"ap":2,"mana":5,"range":null,"duration":"1 minute","mech":"1d12 piercing · concentration","desc":"You coat your armor in biting magical thorns, punishing any foe reckless enough to strike you in close combat. You enhance your armor with magical thorns. Whenever a melee attack targeting you hits, the attacker takes [1d12] piercing damage that ignores armor. Damage you take does not break this spell’s concentration. The spell ends only if you cast another concentration spell or choose to end it.","tags":["damage","buff"]},{"id":"thunderclap","name":"Thunderclap","classId":"guardian","cls":"Guardian","path":"Warrior","level":1,"ap":3,"mana":10,"range":"5 ft","duration":null,"mech":"2d6 + 3 + mod thunder · WIS save","desc":"You slam your weapon into the ground, releasing a concussive burst of thunder that rattles enemies and hardens your stance against retaliation. You smash your weapon on the ground. All foes within range must succeed on a Wis saving throw or take [spell modifier + 3 + 2d6] thunder damage. Until the start of your next turn, when an affected creature attacks you your armor is doubled against their attacks.","tags":["damage","thunder"]},{"id":"warding-omen","name":"Warding omen","classId":"guardian","cls":"Guardian","path":"Warrior","level":1,"ap":2,"mana":5,"range":"60 ft","duration":"1 turn","mech":"WILL save","desc":"You inscribe a fleeting arcane warning upon the battlefield, compelling a foe to keep their distance or suffer momentary paralysis. You force a creature within range to make a Will saving throw. On a failure, choose a creature to ward. If the target ends their next turn closer to the warded creature than they were at the start of that turn, they receive [1 stunned stack].","tags":["control","defense"]},{"id":"commanding-halt","name":"Commanding Halt","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":3,"mana":50,"range":"30 ft","duration":null,"mech":"CONST save","desc":"You bellow a command that locks enemies in place through sheer force of presence. Force a creature within range to make a Constitution saving throw. On a failure, it gains [4 rooted stacks]. On a success, it gains [2 rooted stacks]. You may spend 1 additional AP to affect all enemies within range instead. Alternatively, you may spend 2 additional AP to apply [disarmed stacks] instead of rooted stacks.","tags":["control","aoe"]},{"id":"fracture","name":"Fracture","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":2,"mana":35,"range":null,"duration":null,"mech":"","desc":"You strike with calculated force, breaking defenses or corroding resilience through repeated blows. When a weapon attack you make hits, you may apply Shatter to that attack. Choose one: ● Apply [3 weakened stacks] to the target ● Apply [3 corroded stacks] to the target This spell may be recast on the same turn and on the same attack, but you cannot apply the same type of stacks more than once per turn. You may apply both weakened and corroded in a single cast. If you do, apply the same number...","tags":["debuff"]},{"id":"guard-s-grasp","name":"Guard’s Grasp","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":1,"mana":20,"range":"30 ft","duration":null,"mech":"STR save","desc":"You extend your will through your weapon, dragging enemies into your reach. Force a creature or object within range to make a Strength saving throw. On a failure, it is pulled toward you by [1d4 × 5] ft. You may double the spell’s range. If you do, you begin your next turn Dazed.","tags":["control","defense"]},{"id":"guarding-dome","name":"Guarding dome","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":4,"mana":60,"range":null,"duration":"1 minute","mech":"concentration","desc":"You project a protective barrier, absorbing devastation so those within may endure. Create a magical dome with a 15 ft radius centered on you. When the dome is created, choose whether it guards against physical or magical damage. All creatures within the dome take only half damage from the chosen damage type. The remaining damage is absorbed by the dome. The dome can absorb up to [4 x spell modifier + 45 + 8d12] total damage before dispersing.","tags":["defense","aoe"]},{"id":"inspiring-courage","name":"Inspiring courage","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":5,"mana":75,"range":"60 ft","duration":null,"mech":"","desc":"Your presence steels the resolve of those around you, driving fear from their hearts. You end the terrified effect on up to [spell modifier] creatures within range. You may choose yourself as a target, in which case all terrified stacks affecting you are removed. Alternatively, instead of affecting other creatures, you may remove all stacks of one chosen negative effect affecting yourself. If you do so, you are immune to gaining new stacks of that effect for 1 round","tags":["defense","aoe"]},{"id":"knight-s-vow","name":"Knight’s vow","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":2,"mana":60,"range":"60 ft","duration":"up to 1 min","mech":"concentration","desc":"You swear a binding vow of protection, placing yourself between danger and your charge no matter the cost. Choose a creature within range. For the duration, whenever that creature would take damage, you take the damage instead. You may end this effect at any time after any creature’s action (not in the middle of an attack after damage is revealed). Damage transferred through this spell: ● Is reduced using the original target’s armor and resistances ● Is then applied to you without using your ...","tags":["defense"]},{"id":"phoenix-dive","name":"Phoenix Dive","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":4,"mana":50,"range":"60 ft","duration":null,"mech":"","desc":"You cloak yourself in the fire of rebirth and hurl yourself skyward, sheer resolve keeping you alive as you crash back down with relentless force, clearing the battlefield around you. You leap and land at an unoccupied point within range, gaining Perseverance for one round, causing you to remain at 1 HP the first time you would die during that round. The impact clears all standard surfaces within 10 ft of the landing point. You may instead choose to only perform the leap for 1 AP, or only gai...","tags":["defense","movement"]},{"id":"shield-bash-lv2","name":"Shield bash","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":4,"mana":70,"range":"melee","duration":null,"mech":"CONST save","desc":"You slam your shield forward with brutal momentum, rattling both body and mind. Force a creature within range to make a Constitution saving throw. On a failure, it gains [3 stunned stacks].","tags":["control","defense"]},{"id":"spectral-prison","name":"Spectral prison","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":1,"mana":55,"range":null,"duration":null,"mech":"spectral · channeling","desc":"You conjure an unyielding confinement, trapping a creature within manifested restraint. After 1 minute of channeling, you create a cage of solid spectral metal bars sized to contain a creature of Large size or smaller. You choose the cage’s exact dimensions.","tags":["damage","control","summon","spectral"]},{"id":"warden-s-fortitude","name":"Warden’s Fortitude","classId":"guardian","cls":"Guardian","path":"Warrior","level":2,"ap":3,"mana":55,"range":null,"duration":null,"mech":"heals 3d10 + 32 + 2×mod","desc":"You draw strength from discipline and calm, knitting wounds through sheer resilience and even acting as a shield against oncoming harm. Heal yourself for [2 x spell modifier + 32 + 3d10]. You may cast this spell as a reaction when you would receive damage. If you do, the mana cost is doubled and you become crystallized until the end of your next turn. The crystallization takes effect before the damage is received, fully blocking it.","tags":["healing","defense"]},{"id":"aggravating-shout","name":"Aggravating shout","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":2,"mana":110,"range":"30 ft","duration":"1 min","mech":"WIS save","desc":"You force a creature within range to make a Wis saving throw. On a fail, the target must deal [300] damage to you before it is able to damage other creatures (after the duration expires or after dealing said amount of damage the spell ends on the creature)","tags":["debuff"]},{"id":"bond-of-the-protector","name":"Bond of the protector","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":2,"mana":110,"range":"60 ft","duration":"3 turns","mech":"concentration","desc":"You bond with a creature for the duration. The creature receives all healing you receive for the duration (no similar effect can be cast from the other creature to you, for example 2 guardians casting bond of the protector on each other). If at any point you and the creature are more than [distance] away the bond breaks.","tags":["healing","defense"]},{"id":"castle-wall","name":"Castle wall","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":4,"mana":125,"range":"60 ft","duration":"1 min","mech":"concentration","desc":"You create a 90 ft long 30 ft tall wall centered on a point within range (the wall stops in walls/surfaces etc, making it smaller, depending on the space). The wall absorbs all projectile attacks (from both sides). The wall disperses after the duration or after absorbing [300] damage.","tags":["defense"]},{"id":"chains-of-sacrifice","name":"Chains of sacrifice","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":2,"mana":110,"range":"30 ft","duration":"1 min","mech":"ice · CHA save · concentration","desc":"You force all enemy creatures within range to roll a cha saving throw. On a fail a magical, spectral chain binds them to you. If there are any creatures that fail the saving throw, a number of chains also bind you to the ground, rooting you. The bound creatures cannot go further than 30 ft away from you. You can choose to end the spell early at any point during your turn. Targets CANNOT repeat the saving throw.","tags":["damage","control","aoe","ice"]},{"id":"elusive-skin","name":"Elusive skin","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":3,"mana":120,"range":null,"duration":"1 min","mech":"","desc":"You give a creature within melee range a special resistance to magic. The creature gains a magic shield of [3 x spell modifier + 62 + 6d8]. While the magic shield is active the target has advantage on saving throws against spells.","tags":["buff","defense"]},{"id":"protective-thorns","name":"Protective thorns","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":3,"mana":105,"range":null,"duration":"1 minute","mech":"6d12 + 91 + 3×mod piercing","desc":"You create a layer of thorns on your armor that help protect you. You gain a physical shield of [3 x spell modifier + 91 + 6d12]. Whenever a weapon melee attack against you is made, the target takes [3 x spell modifier] piercing damage (that pierces armor) if the attack hits.","tags":["damage","defense"]},{"id":"shatter-armor","name":"Shatter armor","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":3,"mana":105,"range":null,"duration":"3 turns","mech":"10d4 + 40 + 3×mod crushing · melee spell attack","desc":"Make a melee spell attack against a foe. On a hit the target takes [3 x spell modifier + 40 + 10d4] crushing damage and has their PA reduced by [your PA / 5] for the duration. This effect cannot stack.","tags":["damage","debuff","defense"]},{"id":"shield-bash-lv3","name":"Shield bash","classId":"guardian","cls":"Guardian","path":"Warrior","level":3,"ap":3,"mana":115,"range":null,"duration":null,"mech":"6d6 + 24 + 3×mod crushing · melee spell attack · CONST save","desc":"Make a melee spell attack against a foe. On a hit, the target takes [3 x spell modifier + 24 + 6d6] crushing damage and must roll a const saving throw. On a fail the target is stunned for 1 turn. If the target succeeds, but does roll within 5 (5 included) of DC they are knocked prone instead.","tags":["damage","control","defense"]},{"id":"commanding-shout","name":"Commanding shout","classId":"guardian","cls":"Guardian","path":"Warrior","level":4,"ap":4,"mana":210,"range":"60 ft","duration":null,"mech":"","desc":"You let out a battlecry. All enemy creatures within range must succeed on a Wis saving throw, or spend their next turn moving towards you (until they are in melee range), and then attacking you in any way.","tags":["defense","aoe"]},{"id":"cosmic-shield","name":"Cosmic shield","classId":"guardian","cls":"Guardian","path":"Warrior","level":4,"ap":6,"mana":160,"range":"60 ft","duration":"3 turns","mech":"channeling","desc":"After channelling for 3 turns (at the end of your third turn, so after 2 rounds), you and allies that were within range at the start of the channel become invulnerable for 3 turns. You can only cast this while in combat, and the effect instantly ends if combat ends.","tags":["debuff","defense"]},{"id":"fraction-time","name":"Fraction time","classId":"guardian","cls":"Guardian","path":"Warrior","level":4,"ap":1,"mana":75,"range":null,"duration":null,"mech":"","desc":"You break the fabric of time for a second. You regain 1d4 * 25% of the damage you have taken since the end of your last turn. Cannot be cast more than once per turn.","tags":["healing"]},{"id":"glacial-armor","name":"Glacial armor","classId":"guardian","cls":"Guardian","path":"Warrior","level":4,"ap":3,"mana":150,"range":null,"duration":"1 min","mech":"concentration","desc":"You gain [4 x spell modifier + 105 + 8d12] temporary HP. Half of all the damage you deal recovers the temporary HP (the initial value cannot be exceeded, and the effect does end if the temporary HP reaches 0, but you can “heal” the temporary hp with the damage dealt). The concentration on this spell cannot be broken by damage received, only by casting another concentration spell.","tags":["healing","defense"]},{"id":"rallying-strike","name":"Rallying strike","classId":"guardian","cls":"Guardian","path":"Warrior","level":4,"ap":2,"mana":150,"range":"90 ft","duration":"1 turn","mech":"","desc":"You can add this spell to an attack (before or after bla bla), marking the target. Until the start of your next turn, allies can make weapon attacks from up to 90 ft away on the marked target and the attacks teleport them next to the marked target (closest unoccupied space). Your allies do not have to use the range and teleportation, but if they do use the range increase the teleportation happens.","tags":["movement"]},{"id":"reconstruct","name":"Reconstruct","classId":"guardian","cls":"Guardian","path":"Warrior","level":4,"ap":6,"mana":170,"range":null,"duration":"5 turns","mech":"channeling","desc":"You attempt to reconstruct your body. You are stunned for the duration, but regain 40% of your max HP at the end of every turn. You can end the effect early (at the start of one of your turns). Every time you cast this spell the percentage regained decreases by 5%. Resets on long rests.","tags":["healing","debuff","control","summon"]},{"id":"steward-s-duty","name":"Steward’s duty","classId":"guardian","cls":"Guardian","path":"Warrior","level":4,"ap":2,"mana":150,"range":"60 ft","duration":"1 min","mech":"concentration","desc":"You ward a creature within range. Whenever another creature attacks them you can use your reaction to make 1 free attack against them. If they are outside your range you throw your shield (and it automatically bounces back to you).","tags":["defense"]},{"id":"crystallize","name":"Crystallize","classId":"guardian","cls":"Guardian","path":"Warrior","level":5,"ap":2,"mana":400,"range":"60 ft","duration":"1 min","mech":"STR save","desc":"You crystallize a creature within range for up to [duration]. You can end the effect early during your turns (no cost). An unwilling creature must succeed on a Str saving throw to avoid the effect (a creature that failed cannot repeat the saving throw to end the effect early).","tags":["debuff"]},{"id":"raise-fortress","name":"Raise fortress","classId":"guardian","cls":"Guardian","path":"Warrior","level":5,"ap":6,"mana":220,"range":null,"duration":"24 hours","mech":"channeling","desc":"After 1 minute of channel you make a fortress appear in an unoccupied space that you can see (the space must be able to support a fortress, you cannot create it on water for example etc.). The fortress can occupy up to 2500 ft square, and you choose all the details regarding its design (within reasonable limits).","tags":["ritual"]},{"id":"spectral-charge","name":"Spectral charge","classId":"guardian","cls":"Guardian","path":"Warrior","level":5,"ap":4,"mana":285,"range":null,"duration":"1 turn","mech":"10d8 + 75 + 5×mod spectral · CONST save","desc":"You take the form of a huge spectral animal, like a bull, a ram or a rhino. You charge in a 100 ft long 20 ft wide line. All creatures in the line must succeed on a const saving throw or take [5 x spell modifier + 75 + 10d8] spectral damage and be pushed back to the end of the line where they are knocked prone. If you hit a surface like a wall or building that is made of a sturdy enough material for you not to break you stop in the surface, and the creatures are pushed into it and stunned ins...","tags":["damage","control","aoe","spectral"]},{"id":"acid-spatter","name":"Acid Spatter","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":6,"mana":20,"range":"self (15 ft cone)","duration":"3 rounds","mech":"poison","desc":"Unleash a corrosive wave in a 15 ft cone. All creatures gain 1 Corroded stack and receive an Envenomed effect of [spell modifier + 5 + 4d4] lasting 3 rounds.","tags":["damage","aoe","poison"]},{"id":"grasping-vine","name":"Grasping Vine","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":2,"mana":5,"range":"60 ft","duration":null,"mech":"savingThrow · STR save","desc":"Call upon nearby vegetation to lash out. If a tree or bush is within 15 ft of the target, it must succeed on a STR save or receive 1 Disarmed stack.","tags":["debuff"]},{"id":"hardened-skin","name":"Hardened Skin","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":0,"mana":5,"range":"self","duration":"1 turn","mech":"","desc":"Reaction. When an attack hits you, gain 8 PA until the end of the current creature's turn.","tags":["defense"]},{"id":"hidden-message","name":"Hidden Message","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":2,"mana":5,"range":"30 ft","duration":null,"mech":"","desc":"Inscribe a message onto natural elements. Druids and designated creatures perceive it automatically. Others need Investigation check vs spell DC or magic to detect. Dispelled by certain spells or Arcana check vs 5x spell save DC.","tags":["utility"]},{"id":"natures-bolt","name":"Nature's Bolt","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":3,"mana":5,"range":"30 ft","duration":null,"mech":"2d8 + 8 + mod poison · heals 2d8 + 8 + mod · ranged spell attack","desc":"Unleash nature's power at a target. Choose: deal poison damage (attack roll), apply 1 poisoned stack (auto), apply 1 corroded stack (auto), or heal (no roll). Can be cast multiple times per turn.","tags":["damage","healing","poison"]},{"id":"natures-touch","name":"Nature's Touch","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":3,"mana":10,"range":"melee","duration":null,"mech":"heals 4d6 + 16 + mod","desc":"Heal an ally in melee range. May spend 1 additional AP to end 1 Envenomed effect. Can be cast multiple times per turn.","tags":["healing"]},{"id":"speak-with-animals","name":"Speak with Animals","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":1,"mana":5,"range":"self","duration":"1 minute","mech":"","desc":"Understand and communicate with animals for the duration. Animals regard you as friendly when Animal Protector is active.","tags":["defense"]},{"id":"sudden-growth","name":"Sudden Growth","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":2,"mana":5,"range":"30 ft","duration":"1 minute","mech":"","desc":"Force nature to erupt from the ground. A massive plant grows at a point within range forming a 5 ft radius base rising 20 ft high. Creatures on the area are lifted. Climbing costs 1 AP per 20 ft.","tags":["aoe"]},{"id":"summon-sapling","name":"Summon Sapling","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":1,"mana":5,"range":"60 ft","duration":"1 hour","mech":"","desc":"Summon a sapling that obeys your commands. AC equal to yours, 1 HP (takes max 1 damage per instance), 30 ft MS. Acts before your turn. Counts as a tree for spells/abilities. Leaves a trail of natural ground.","tags":["summon","ritual"]},{"id":"toxic-spore","name":"Toxic Spore","classId":"druid","cls":"Druid","path":"Wildborn","level":1,"ap":4,"mana":10,"range":"30 ft","duration":null,"mech":"2d12 + 18 + mod poison · savingThrow · CONST save","desc":"Plant a volatile spore in target. CON save or take poison damage. If target is Envenomed, infection spreads to all creatures within 5 ft (same save/damage). Does not chain further.","tags":["damage","aoe","poison"]},{"id":"acid-ray","name":"Acid Ray","classId":"druid","cls":"Druid","path":"Wildborn","level":2,"ap":3,"mana":55,"range":"30 ft","duration":"1 minute","mech":"4d10 + 33 + 2×mod poison · ranged spell attack","desc":"Ranged spell attack. On hit, deal poison damage and reduce target's PA for the duration: -4 PA if wearing armor, -8 PA if wearing heavy armor.","tags":["damage","defense","poison"]},{"id":"grasping-roots","name":"Grasping Roots","classId":"druid","cls":"Druid","path":"Wildborn","level":2,"ap":3,"mana":60,"range":"self (30 ft line)","duration":"1 minute","mech":"4d8 + 15 + 2×mod piercing · savingThrow · CONST save","desc":"Vines strike all enemies in a 30 ft long 5 ft wide line. CON save or take piercing damage and be rooted for the duration.","tags":["damage","control","aoe"]},{"id":"one-with-nature","name":"One with Nature","classId":"druid","cls":"Druid","path":"Wildborn","level":2,"ap":1,"mana":55,"range":"self","duration":"1 minute","mech":"concentration","desc":"Become invisible in nature as long as you don't attack. Investigation check exceeding your spell DC reveals you. You can move but are not invisible while moving.","tags":["movement"]},{"id":"seed-of-replenishment","name":"Seed of Replenishment","classId":"druid","cls":"Druid","path":"Wildborn","level":2,"ap":3,"mana":55,"range":"30 ft","duration":"3 turns","mech":"heals 4d6 + 18 + 2×mod","desc":"Plant a seed that grows each turn. Designated creatures can eat it (must be adjacent). Heals [2x spell mod + 18 + 4d6], increasing by the same each turn up to 2 turns max.","tags":["healing"]},{"id":"seed-of-the-seeker","name":"Seed of the Seeker","classId":"druid","cls":"Druid","path":"Wildborn","level":2,"ap":1,"mana":50,"range":"self","duration":"10 hours","mech":"concentration","desc":"Create a magical seed. Know its exact location always (unless blocked by lvl 4+ spells or MATERIAL). If carried by a creature, sense their basic strong emotions.","tags":["defense","ritual"]},{"id":"spiked-weapons","name":"Spiked Weapons","classId":"druid","cls":"Druid","path":"Wildborn","level":2,"ap":1,"mana":20,"range":"30 ft","duration":"1 minute","mech":"2d4 + 2×mod piercing","desc":"Grow spikes on an ally's weapon. Their weapon attacks deal additional piercing damage for the duration. Cannot affect more having channelled), strike a foe with a lightning spear of Valor. Electrified bonus: roll 1d12; if target's might is <= the roll, instant kill.","tags":["damage","lightning"]},{"id":"lightning-shift","name":"Lightning Shift","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":7,"ap":4,"mana":510,"range":"90 ft","duration":null,"mech":"savingThrow · CHA save","desc":"Launch up to [spell modifier] lightning bolts. Each target must CHA save or be teleported to an adjacent plane (random). If willingly failing, you choose the plane. Success grants 24-hour immunity.","tags":["debuff","defense","movement","aoe"]},{"id":"natures-power","name":"Nature's Power","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":7,"ap":1,"mana":250,"range":"500 ft","duration":"1 minute","mech":"concentration","desc":"Draw power from surrounding nature. For the duration, AP recovery increases by 1 for each natural element present in range: trees, animals, lakes/rivers, caves/tunnels/terrain surfaces (max +4).","tags":["buff"]},{"id":"prophecy-of-woe","name":"Prophecy of Woe","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":7,"ap":4,"mana":300,"range":"15 ft","duration":"1 week","mech":"600 true","desc":"Choose a target and secretly name an act against nature. If the target does it within a week, takes 600 true damage. The act must be specific (burn a tree, kill an animal, etc.). Does not take effect if forced, mind-controlled, or in self-defense.","tags":["damage"]},{"id":"winds-of-the-apocalypse","name":"Winds of the Apocalypse","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":7,"ap":6,"mana":315,"range":"10 ft","duration":"up to 10 hours","mech":"7d20 + 7×mod crushing · savingThrow · CONST save · channeling","desc":"After 3 turns channelling, summon apocalyptic winds. CON save or be pulled into the tornado. Creatures in the way take crushing damage every turn (ignores armor). Airborne creatures can attack/cast with disadvantage. Tornado moves 1d10 x 10 ft your chosen direction each turn.","tags":["damage","debuff","control","summon","ritual","aoe"]},{"id":"ascension","name":"Ascension","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":8,"ap":1,"mana":375,"range":"self","duration":"1 turn","mech":"","desc":"Ascend 10,000 ft into the sky until end of your next turn. Can still take damage if creatures have means. Casting ranges increased by 20,000 ft. Return to ground at end of next turn.","tags":["buff"]},{"id":"lightning-mastery","name":"Lightning Mastery","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":8,"ap":0,"mana":135,"range":"self","duration":"1 minute","mech":"","desc":"Overload for the duration. Lightning damage you deal is doubled. All spells electrify all targets hit (no cost). Electrify standard damage becomes 5d10 instead of 1d10.","tags":["aoe"]},{"id":"natures-voice","name":"Nature's Voice","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":8,"ap":0,"mana":350,"range":"90 ft","duration":"1 hour","mech":"","desc":"You and up to [spell modifier] creatures become immune to silence for the duration (silenced effect ends on them). Cannot be overwritten by anything short of god powers.","tags":["control","defense","ritual"]},{"id":"storm-of-fate","name":"Storm of Fate","classId":"stormbringer","cls":"Stormbringer","path":"Wildborn","level":8,"ap":6,"mana":460,"range":"90 ft","duration":"up to 1 minute","mech":"16d10 + 254 + 8×mod lightning · channeling","desc":"Channel a cosmic storm. All marked creatures (you choose who to protect) take lightning damage at end of each channelling turn, no matter where they are. Pierces armor and almost all protective effects. Electrified bonus: target's location is revealed.","tags":["damage","defense","lightning"]},{"id":"bolt-of-the-elements","name":"Bolt of the elements","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":1,"ap":3,"mana":5, ":"Ice bolt","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":1,"ap":2,"mana":10,"range":"90 ft","duration":"1 turn","mech":"2d6 + 6 + mod ice · ranged spell attack","desc":"Make a ranged spell attack on a target within range. On a hit the target takes [spell modifier + 6 + 2d6] ice damage and has their speed reduced by 10 (chilled effect).","tags":["damage","debuff","ice"]},{"id":"poison-bolt","name":"Poison bolt","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":1,"ap":3,"mana":12,"range":"30 ft","duration":"3 turns","mech":"2d10 + 8 + mod poison · ranged spell attack","desc":"Make a ranged spell attack on a target within range. On a hit the target takes [spell modifier + 8 + 2d10] poison damage. The target becomes covered in acid reducing their PA by [1d4] for the duration or until washed off. (this effect does not stack).","tags":["damage","defense","poison"]},{"id":"control-water","name":"Control water","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":2,"ap":1,"mana":50,"range":"90 ft","duration":null,"mech":"channeling","desc":"You channel on a body of water no bigger than [2] m3 and slowly manoeuvre it, moving it in any direction, and giving it shapes of your choice.","tags":["utility"]},{"id":"elemental-strike","name":"Elemental strike","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":2,"ap":0,"mana":30,"range":"60 ft","duration":null,"mech":"","desc":"You enhance a weapon attack of an ally (you can choose to enhance it after the attack roll). You add [2 x spell modifier] elemental damage (any of the 4 you choose) to the attack, and convert the damage of the attack to said type of damage.","tags":["buff"]},{"id":"lightning-fork","name":"Lightning fork","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":2,"ap":3,"mana":60,"range":"60 ft","duration":null,"mech":"2d10 + 23 + 2×mod lightning · ranged spell attack","desc":"Make a ranged spell attack on a target within range. On a hit the target takes [2 x spell modifier + 23 + 2d10] lightning damage and the attack forks to up to 2 enemies within 5 ft of the target (regardless of whether the attack hit or missed). Make a ranged spell attack for each target the spell forked to (the damage is the same).","tags":["damage","aoe","lightning"]},{"id":"poison-spray","name":"Poison spray","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":2,"ap":4,"mana":75,"range":"30 ft","duration":null,"mech":"2d12 + 41 + 2×mod poison · CONST save","desc":"You throw a wave of poison that strikes at a 15 ft long line centered on a point within range (the line is perpendicular on the trajectory - like you would face the wall created by it). All creatures in the line must succeed on a Const saving throw or take [2 x spell modifier + 41 + 2d12] poison damage.","tags":["damage","aoe","poison"]},{"id":"searing-daggers","name":"Searing daggers","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":2,"ap":3,"mana":60,"range":"60 ft","duration":null,"mech":"2d8 + 7 + 2×mod fire · ranged spell attack","desc":"You create 3 daggers of fire that you throw at 3 targets (not necessarily different). Make 3 ranged spell attacks. On a hit a target takes [2 x spell modifier + 7 + 2d8] fire damage.","tags":["damage","fire"]},{"id":"wave-of-frost","name":"Wave of frost","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":2,"ap":3,"mana":60,"range":"30 ft","duration":null,"mech":"6d12 + 33 + 2×mod ice","desc":"You freeze all water surfaces within range. ALL creatures that were standing on such surfaces take [2 x spell modifier + 33 + 6d12] ice damage.","tags":["damage","control","aoe","ice"]},{"id":"winter-blast","name":"Winter blast","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":2,"ap":3,"mana":55,"range":"90 ft","duration":null,"mech":"2d10 + 26 + 2×mod ice · DEX save","desc":"You force all enemy creatures within 5 ft of a point within rang  1 and an ac of 0 but is immune to surfaces. On death it explodes, dealing [3 x spell modifier + 24 + 3d8] poison damage to all creatures within 15 ft of it that fail a Dex saving throw, or half as much to those who succeed.","tags":["damage","defense","aoe","poison"]},{"id":"scorching-ray","name":"Scorching ray","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":3,"ap":3,"mana":110,"range":"self","duration":null,"mech":"3d12 + 45 + 3×mod fire · DEX save","desc":"You create a line of fire that scorches all creatures in its path. The line is 100 ft long and 10 ft wide starting from you. All creatures in its path must succeed on a dex saving throw or take [3 x spell modifier + 45 + 3d12] fire damage.","tags":["damage","aoe","fire"]},{"id":"sudden-combustion","name":"Sudden combustion","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":3,"ap":2,"mana":80,"range":"60 ft","duration":null,"mech":"3d10 + 56 + 3×mod fire","desc":"If a target is burning from any sources you consume the burning (ends the effect) and deal [3 x spell modifier + 56 + 3d10] fire damage.","tags":["damage","fire"]},{"id":"electricity-assault","name":"Electricity assault","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":4,"ap":3,"mana":165,"range":"60 ft","duration":null,"mech":"2d6 + 21 + mod lightning · DEX save","desc":"You mark a point within range. Four blasts of electricity hit a 15 ft radius area centered on the point. A target must succeed on a dex saving throw or take [spell modifier + 21 + 2d6] lightning damage. If a target is hit by at least 3 blasts they must succeed on a const saving throw or be stunned for 1 turn (increased to 3 turns if they got hit by all 4; const saving throw at the end of each turn to end the stun).","tags":["damage","control","aoe","lightning"]},{"id":"elemental-immunity","name":"Elemental immunity","classId":"elementalist","cls":"Elementalist","path":"Wizard","level":4,"ap":3,"mana":125,"range":"self","du
