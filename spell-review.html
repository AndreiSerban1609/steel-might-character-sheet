<style>
:root {
  --bg: #f3ecdc; --panel: #faf6ec; --panel-2: #efe6d2; --border: #cdbf9c; --border-soft: #e2d7bc;
  --gold: #8a6a1c; --gold-soft: #b8952f; --text: #2a2318; --dim: #6e6250; --mute: #9a8d74;
  --mark: #b1471f; --chip-bg: rgba(138,106,28,0.08);
  --fire:#b8471a; --ice:#1f7fb0; --lightning:#9a7a08; --shadow:#6d2fa3; --light:#a98515; --poison:#2f8a4f;
  --psychic:#a53b62; --thunder:#5a7788; --force:#2f4fb5; --pure:#5b6b95; --spectral:#5b8090;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14110d; --panel: #1e1a13; --panel-2: #262118; --border: #4a3f2a; --border-soft: #2f2819;
  --gold: #d4af37; --gold-soft: #b08d2e; --text: #e8e0cf; --dim: #a89a7c; --mute: #7a6e57;
  --mark: #e0713f; --chip-bg: rgba(212,175,55,0.08);
  --fire:#f0a060; --ice:#60c0f0; --lightning:#f5e088; --shadow:#c080f0; --light:#f5e6a0; --poison:#80d0a0;
  --psychic:#f0a0be; --thunder:#b8d0e0; --force:#80a0f0; --pure:#c0cde8; --spectral:#b8d0e0;
} }
:root[data-theme="dark"] {
  --bg: #14110d; --panel: #1e1a13; --panel-2: #262118; --border: #4a3f2a; --border-soft: #2f2819;
  --gold: #d4af37; --gold-soft: #b08d2e; --text: #e8e0cf; --dim: #a89a7c; --mute: #7a6e57;
  --mark: #e0713f; --chip-bg: rgba(212,175,55,0.08);
  --fire:#f0a060; --ice:#60c0f0; --lightning:#f5e088; --shadow:#c080f0; --light:#f5e6a0; --poison:#80d0a0;
  --psychic:#f0a0be; --thunder:#b8d0e0; --force:#80a0f0; --pure:#c0cde8; --spectral:#b8d0e0;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: 'Crimson Text', Georgia, serif; font-size: 16px; line-height: 1.45; }
.bar { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--border); padding: 12px 20px 10px; display: flex; flex-direction: column; gap: 10px; }
.bar-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font-family: 'Cinzel', 'Palatino', serif; font-weight: 600; font-size: 20px; letter-spacing: 1px; margin: 0; color: var(--gold); }
.count { color: var(--dim); font-variant-numeric: tabular-nums; }
.count b { color: var(--text); font-weight: 600; }
.hint { color: var(--mute); font-style: italic; margin-left: auto; font-size: 14px; }
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.controls input[type=search], .controls select { font: inherit; font-size: 15px; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 5px 9px; }
.controls input[type=search] { flex: 1 1 260px; min-width: 200px; }
.controls input:focus-visible, .controls select:focus-visible, .chip:focus-visible, button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
.switch { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); cursor: pointer; white-space: nowrap; }
.switch input { accent-color: var(--gold); }
button.clear { font: inherit; font-size: 14px; background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 4px; padding: 4px 10px; cursor: pointer; }
button.clear:hover { color: var(--text); border-color: var(--gold-soft); }
.tagbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.tagbar .sep { width: 1px; height: 18px; background: var(--border); margin: 0 4px; }
.chip { --c: var(--gold); display: inline-flex; align-items: center; gap: 4px; font-family: 'Cinzel', 'Palatino', serif; font-size: 10.5px; letter-spacing: 0.8px; text-transform: uppercase; color: var(--c); background: var(--chip-bg); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); border-radius: 3px; padding: 3px 7px; cursor: pointer; user-select: none; line-height: 1; }
.chip .n { color: var(--mute); font-size: 9.5px; letter-spacing: 0; }
.chip:hover { border-color: var(--c); }
.chip.on { background: var(--c); color: var(--bg); border-color: var(--c); }
.chip.on .n { color: var(--bg); opacity: 0.8; }
.chip[data-tag=fire]{--c:var(--fire)} .chip[data-tag=ice]{--c:var(--ice)} .chip[data-tag=lightning]{--c:var(--lightning)}
.chip[data-tag=shadow]{--c:var(--shadow)} .chip[data-tag=light]{--c:var(--light)} .chip[data-tag=poison]{--c:var(--poison)}
.chip[data-tag=psychic]{--c:var(--psychic)} .chip[data-tag=thunder]{--c:var(--thunder)} .chip[data-tag=force]{--c:var(--force)}
.chip[data-tag=pure]{--c:var(--pure)} .chip[data-tag=spectral]{--c:var(--spectral)}
main { max-width: 1180px; margin: 0 auto; padding: 8px 20px 80px; }
.group-head { position: sticky; top: var(--bar-h, 132px); z-index: 5; background: var(--bg); display: flex; align-items: baseline; gap: 12px; margin: 22px 0 6px; padding: 6px 0; border-bottom: 1px solid var(--border); }
.group-head h2 { font-family: 'Cinzel', 'Palatino', serif; font-size: 17px; font-weight: 600; letter-spacing: 1px; margin: 0; color: var(--gold); }
.group-head span { color: var(--dim); font-size: 14px; font-variant-numeric: tabular-nums; }
.spell { display: grid; grid-template-columns: 220px 1fr; gap: 6px 22px; padding: 12px 0 12px 12px; border-bottom: 1px solid var(--border-soft); border-left: 3px solid transparent; margin-left: -15px; }
.spell.bare { border-left-color: var(--mark); background: linear-gradient(90deg, color-mix(in srgb, var(--mark) 7%, transparent), transparent 40%); }
.name { font-family: 'Cinzel', 'Palatino', serif; font-size: 15px; font-weight: 600; margin: 0; line-height: 1.25; }
.sub { color: var(--dim); font-size: 14px; margin-top: 2px; }
.stats { display: grid; grid-template-columns: auto auto; gap: 1px 10px; margin: 6px 0 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }
.stats dt { color: var(--mute); text-transform: uppercase; font-size: 10px; letter-spacing: 0.8px; font-family: 'Cinzel', serif; }
.stats dd { margin: 0; color: var(--text); }
.stats div { display: contents; }
.id { font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; color: var(--mute); margin-top: 6px; cursor: copy; word-break: break-all; }
.id:hover { color: var(--gold); }
.mech { color: var(--dim); font-size: 14px; font-style: italic; margin-bottom: 4px; }
.desc { margin: 0; max-width: 72ch; white-space: pre-line; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 8px; }
.empty { color: var(--dim); font-style: italic; padding: 40px 0; text-align: center; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--gold); color: var(--bg); font-family: 'Cinzel', serif; font-size: 12px; letter-spacing: 1px; padding: 6px 14px; border-radius: 4px; opacity: 0; transition: opacity 0.2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 720px) { .spell { grid-template-columns: 1fr; } .stats { grid-template-columns: auto auto auto auto; } }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

apon with teleportation power. On hit, you can teleport the target up to 20 ft (on a safe surface).","tags":["buff","movement"]},{"id":"thunder-blow","name":"Thunder Blow","classId":"striker","cls":"Striker","path":"Battlemage","level":4,"ap":3,"mana":155,"range":"self","duration":null,"mech":"8d10 + 63 + 4×mod force · savingThrow · STR save","desc":"You enhance a weapon. The next hit summons a thunder wave in a 40 ft long, 5 ft wide line. Creatures must STR save or take [4 x spell modifier + 63 + 8d10] force damage and be pushed back 1d4 x 10 ft. Half damage on success.","tags":["damage","buff","control","summon","force"]},{"id":"arcane-enhancement","name":"Arcane Enhancement","classId":"striker","cls":"Striker","path":"Battlemage","level":5,"ap":3,"mana":250,"range":"self","duration":"3 turns","mech":"10d12 + 5×mod pure","desc":"You enhance a weapon with the essence of magic. Every hit deals [5 x spell modifier + 10d12] pure damage and applies an arcane stack. At 6 arcane stacks the target takes [10d20] pure damage.","tags":["damage","buff","pure"]},{"id":"final-stand","name":"Final Stand","classId":"striker","cls":"Striker","path":"Battlemage","level":5,"ap":1,"mana":500,"range":"self","duration":"3 turns","mech":"","desc":"For the duration your AC, PA, MA and all speeds drop to 0. Weapon attacks gain 100 ft range (must see target), 50% lifesteal, +10 to hit, and ignore up to [5 x spell modifier] armor. Immune to all CC.","tags":["defense"]},{"id":"striker-overload","name":"Striker Overload","classId":"striker","cls":"Striker","path":"Battlemage","level":5,"ap":3,"mana":350,"range":"self","duration":"2 turns","mech":"","desc":"For the duration your on-hit effects trigger twice instead of once (including added weapon damage from spells like Firebrand).","tags":["utility"]},{"id":"stunning-blows","name":"Stunning Blows","classId":"striker","cls":"Striker","path":"Battlemage","level":5,"ap":3,"mana":300,"range":"self","duration":"3 turns","mech":"savingThrow · CONST save","desc":"You enhance a weapon to stun foes. On hit, the target must CON save or be stunned for 1 turn. A target that saves is immune for the rest of the turn.","tags":["buff","control","defense"]},{"id":"bone-eater","name":"Bone eater","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":2,"mana":12,"range":"30 ft","duration":"3 turns","mech":"mod · concentration","desc":"You consume a corpse, absorbing the essence of their bones. Increases your armors (PA and MA) by [spell modifier] for the duration.","tags":["damage","defense"]},{"id":"breathless","name":"Breathless","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":2,"mana":10,"range":"self","duration":"1 hour","mech":"","desc":"For the duration you are cold to the touch and you do not appear to be breathing (but you are, so you can still suffocate etc.). An investigation check or passive investigation against your spell DC reveal these effects to be nothing more than a mirage. You can end the effect early (no cost required)","tags":["ritual"]},{"id":"pitch-black","name":"Pitch black","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":1,"mana":10,"range":"60 ft","duration":null,"mech":"","desc":"You instantly snuff out all (or the ones you choose) torches, lights, etc. within range that are not kept lit by magical means.","tags":["utility"]},{"id":"raise-skeleton","name":"Raise skeleton","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":3,"mana":10,"range":"30 ft","duration":null,"mech":"1d8 + 8 + mod slashing","desc":"You raise a skeleton from a corpse. The skeleton has 45 hp, 12 AC, 0 PA, 0 MA, 20 MS, 4 ap recovery, and an attack deals [spell modifier + 8 + 1d8] slashing damage. The skeleton takes 25% of its max HP as true damage at the end of each of its turns. It takes its turn right after yours.","tags":["damage","defense","summon"]},{"id":"shadow-bird","name":"Shadow bird","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":3,"mana":11,"range":"60 ft","duration":"1 min","mech":"2d6 + 5 + mod shadow · savingThrow · CONST save · concentration","desc":"You create a shadow bird at an unoccupied space within range and choose a creature. At the start of each of the creature’s turns, if it is within [30 ft] of it, the bird shoots a magic ray at the target. The creature must succeed on a const saving throw or take [spell modifier + 5 + 2d6] shadow damage and be slowed by 10 speed while still within 30 ft of the bird. During your turn you can consume 1 ap to change the target of the bird, but not the position.","tags":["damage","control","shadow"]},{"id":"shadow-bolt","name":"Shadow bolt","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":3,"mana":5,"range":"60 ft","duration":null,"mech":"1d10 + 16 + mod shadow · ranged spell attack","desc":"Make a ranged spell attack on a target within range. On a hit the target takes [spell modifier + 16 + 1d10] shadow damage.","tags":["damage","shadow"]},{"id":"shadow-hand","name":"Shadow hand","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":4,"mana":15,"range":"30 ft","duration":"1 turn","mech":"1d12 + 10 + mod shadow · savingThrow · STR save","desc":"You raise a shadow hand from the ground to grab a target. The target must succeed on a Str saving throw or take [spell modifier + 10 + 1d12] shadow damage and be restrained (snared) for a turn (rooted if the creature is larger than a regular humanoid).","tags":["damage","control","summon","shadow"]},{"id":"shadow-wave","name":"Shadow wave","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":3,"mana":15,"range":"self","duration":null,"mech":"2d8 + 10 + mod shadow · savingThrow · STR save","desc":"You create a wave of darkness in a 15 long cone in front of you. All creatures within range must succeed on a Str saving throw or take [spell modifier + 10 + 2d8] shadow damage and be pushed back 15 ft.","tags":["damage","control","aoe","shadow"]},{"id":"wicked-epiphany","name":"Wicked epiphany","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":1,"ap":2,"mana":10,"range":"90 ft","duration":"1 min","mech":"1d4 + 3 + mod shadow · savingThrow · WIS save","desc":"You force a creature within range to make a Wis saving throw. On a fail the target starts seeing all that is dark and gloomy as the absolute truth of the world. The target takes [spell modifier + 3 + 1d4] shadow damage at the start of each of their turns. The target can repeat the saving throw whenever they are healed, but not at the end of each turn.","tags":["damage","healing","shadow"]},{"id":"corpse-explosion","name":"Corpse explosion","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":3,"mana":55,"range":"40 ft","duration":null,"mech":"6d8 + 21 + 2×mod force · savingThrow · DEX save","desc":"You make a corpse explode. Targets within 10 ft of it must roll a Dex saving throw. On a fail they take [2 x spell modifier + 21 + 6d8] force damage. On a success they take only half.","tags":["damage","aoe","force"]},{"id":"dark-echoes","name":"Dark echoes","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":3,"mana":55,"range":"60 ft","duration":null,"mech":"4d10 + 32 + 2×mod shadow · ranged spell attack","desc":"Make a ranged spell attack on a target within range. On a hit the target takes [2 x spell modifier + 32 + 4d10] shadow damage. If you attack the same target with a single-target (targeted) spell until the end of your next turn you can also cast the spell (free of all costs) on another target within 10 ft of the initial one.","tags":["damage","shadow"]},{"id":"dark-shield","name":"Dark shield","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":3,"mana":50,"range":"self","duration":"1 min","mech":"","desc":"You create a dark shield around you. The first time a targeted (weapon) attack hits you you take no damage and if the attack was melee the attacker is pushed back 15 ft. Only triggers and works on creatures of size large or smaller.","tags":["control","defense"]},{"id":"darkness","name":"Darkness","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":2,"mana":50,"range":"90 ft","duration":"1 min","mech":"concentration","desc":"concentration You create a sphere of darkness (15 ft radius) centered on a point within range. The darkness blocks all light and all creatures in the area are effectively blind (if they don't have darkvision). Creatures outside the area cannot see inside it.","tags":["control","defense","aoe"]},{"id":"despair","name":"Despair","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":11,"mana":50,"range":"90 ft","duration":"1 min","mech":"savingThrow · WILL save","desc":"You force a creature within range to make a Will saving throw or fall in the depths of despair. The target becomes lethargic and lacks all motivation. The target is likely to abandon its post or job. If the target is in a group the target is likely to leave and go somewhere to be alone. The final decision belongs to the dm regarding the appropriate behaviour for the target. On a fail or at the end of the spell the target knows magic was used on them but does not know by whom necessarily (they can deduct it was you or perhaps they saw you etc. but they don't automatically know).","tags":["debuff"]},{"id":"insecurity","name":"Insecurity","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":1,"mana":20,"range":"30 ft","duration":"3 turns","mech":"3×mod shadow · savingThrow · WILL save","desc":"You force a target to make a Will saving throw. On a fail the target becomes insecure and afraid, becoming more susceptible to shadow damage. Their SA is reduced by [3 x spell modifier] for the duration.","tags":["damage","debuff","shadow"]},{"id":"murderous-crows","name":"Murderous crows","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":4,"mana":60,"range":"30 ft","duration":null,"mech":"4d12 + 39 + 2×mod shadow · savingThrow · CONST save","desc":"You send forth a murder of shadow crows against a foe within range. The target must roll a Const saving throw. On a fail they take [2 x spell modifier + 39 + 4d12] shadow damage and are blinded for 1 turn.","tags":["damage","control","shadow"]},{"id":"necrophagy","name":"Necrophagy","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":2,"mana":55,"range":"30 ft","duration":"3 turns","mech":"concentration","desc":"You consume a corpse, absorbing the essence of their flesh. For the duration your AC increases by [4] for the duration.","tags":["buff","defense"]},{"id":"raising-darkness","name":"Raising darkness","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":3,"mana":65,"range":"60 ft","duration":"1 min","mech":"4d8 + 26 + 2×mod shadow · savingThrow · DEX save · concentration","desc":"Mark a point within range. The area on the ground within 15 ft of the point starts glowing in black. At the end of the turn a wave of darkness springs out of the ground and towards the sky. All creatures in the area must succeed on a Dex saving throw or take [2 x spell modifier + 26 + 4d8] shadow damage. If you choose to concentrate on the spell the area remains gloomy, and at the end of each turn of concentration the wave of darkness explodes again, the damage being increased by [5 + 2d8] every time.","tags":["damage","buff","defense","aoe","shadow"]},{"id":"spreading-void","name":"Spreading void","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":2,"ap":2,"mana":35,"range":"90 ft","duration":"1 min","mech":"2d6 + 8 + 2×mod shadow · savingThrow · CONST save","desc":"You force a creature within range to make a Const saving throw. On a fail they are infected with darkness. They are surrounded by a shadowy aura and take [2 x spell modifier + 8 + 2d6] shadow damage at the start of each of their turns. If the target dies the effect is automatically transmitted to the nearest enemy creatures, should any exist within 20 ft of the target, and the duration resets. A target can repeat the saving throw every time they get healed, but not at the end of each turn.","tags":["damage","healing","shadow"]},{"id":"confinement","name":"Confinement","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":2,"mana":70,"range":"60 ft","duration":"2 turns","mech":"savingThrow · WILL save","desc":"You force a target to make a Will saving throw. On a fail they target only receives half healing from all sources. If the target fails the saving throw by more than 5 (if they needed to roll a 15, and they roll 10 or below) they receive no healing instead. You cannot cast this on a creature already affected.","tags":["healing","debuff"]},{"id":"corpse-lunge","name":"Corpse lunge","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":3,"mana":115,"range":"60 ft","duration":null,"mech":"6d8 + 44 + 3×mod spectral","desc":"You consume a corpse to create a shadow spectre that lunges in a 20 ft long line 10 ft wide line in the direction opposite of you (as you are facing the body, the line continues towards the horizon). All creatures in the range must roll a dex saving throw. On a fail they take [3 x spell modifier + 44 + 6d8] spectral damage. On a success they only take half as much.","tags":["damage","defense","aoe","spectral"]},{"id":"dark-servant","name":"Dark servant","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":11,"mana":100,"range":"10 ft","duration":"1 hour","mech":"concentration","desc":"You mark a body with a mark of necromancy. The body rises as it stands and does your bidding (it is unable to fight, but can attempt to accomplish tasks to the best of its abilities). The body has the stats of the creature before death.","tags":["summon","ritual"]},{"id":"dark-sight","name":"Dark sight","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":2,"mana":100,"range":"30 ft","duration":"1 min","mech":"concentration","desc":"You temporarily gain darkvision of 30 ft. This can see through magic darkness as well (that normally blocks vision).","tags":["defense"]},{"id":"dark-sleep","name":"Dark sleep","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":3,"mana":110,"range":"self","duration":"1 min","mech":"concentration","desc":"You fall into a dark sleep. You are crystalised for the duration and your summons no longer take damage over time. All healing you receive is reduced to 0. You can end this effect early (but still end your turn - you wake up and then the round continues).","tags":["healing","control","summon"]},{"id":"false-promise","name":"False promise","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":3,"mana":125,"range":"60 ft","duration":"1 min","mech":"12d12 + 89 + 6×mod shadow · heals 12d12 + 89 + 6×mod","desc":"You heal a creature that is NOT completely healthy (full hp) for [6 x spell modifier + 89 + 12d12]. The target then takes [3 x spell modifier + 35 + 3d12] shadow damage at the start of each of their turns for the duration.","tags":["damage","healing","shadow"]},{"id":"the-four-eyed-crow","name":"The four-eyed crow","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":6,"mana":210,"range":"30 ft","duration":null,"mech":"3d10 + 21 + 3×mod shadow · savingThrow · WILL save","desc":"You send forth a crow at a target within range. The crow flies from one target to another within 10 ft of them (only enemies). The crow prioritizes targets that it hasn't hit yet, but chooses randomly from them. A target “hit” by the crow must succeed on a Will saving throw or take [3 x spell modifier + 21 + 3d10] shadow damage and become terrified for 1 turn. A target can take the damage multiple times but cannot become terrified for more than 1 turn. The crow can bounce up to 5 times (“hitting” a target 6 times).","tags":["damage","shadow"]},{"id":"traumatise","name":"Traumatise","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":3,"mana":110,"range":"30 ft","duration":"2 turns","mech":"savingThrow · WIS save","desc":"You force a creature to make a Wis saving throw or become traumatised for the duration. While traumatised, a creature is stunned, but their PA and MA are tripled and all incoming damage is halved. The creature can repeat the saving throw at the end of each turn.","tags":["control","defense"]},{"id":"unbearable-horror","name":"Unbearable horror","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":3,"mana":105,"range":"60 ft","duration":"1 turn","mech":"6d10 + 43 + 3×mod shadow · savingThrow · INT save","desc":"You force a creature to make an int saving throw. On a fail they take [3 x spell modifier + 43 + 6d10] shadow damage and are affected by weight of darkness until the end of their next turn. Whenever they move while being affected they take [3d10] true damage for every ap consumed moving.","tags":["damage","shadow"]},{"id":"wicked-telekinesis","name":"Wicked telekinesis","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":2,"mana":100,"range":"30 ft","duration":null,"mech":"6d4 + 23 + 3×mod crushing · savingThrow · STR save","desc":"You force a target to make a Str saving throw. On a fail you create a dark beam that lifts them up and drops them with force on a spot within range, damaging them for [3 x spell modifier + 23 + 6d4] crushing damage. Both the target and the “teleporting” destination must be within [range] of you. A willing creature automatically fails the saving throw.","tags":["damage","movement"]},{"id":"wits-leech","name":"Wits leech","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":3,"ap":0,"mana":50,"range":"30 ft","duration":"3 turns","mech":"1d4 + 1 · savingThrow · WIS save · concentration","desc":"You consume a corpse, absorbing their wits. For the duration you add [1d4 + 1] to your: Int and Wis saving throws, passive investigation and passive perception, Perception and Investigation checks.","tags":["damage","defense"]},{"id":"black-speech","name":"Black speech","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":3,"mana":160,"range":"30 ft","duration":null,"mech":"4d8 + 65 + 4×mod shadow · savingThrow · WIS save","desc":"You speak a dark ritual. All enemy creatures within range must roll a Wis saving throw. On a fail they take [4 x spell modifier + 65 + 4d8] shadow damage, or half as much on a success. If a creature failed the saving throw, they cannot target you (can still damage you with aoes) with anything for 1 turn.","tags":["damage","ritual","aoe","shadow"]},{"id":"circle-of-the-wicked","name":"Circle of the wicked","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":2,"mana":155,"range":"self","duration":"3 turns","mech":"concentration","desc":"You create a 30 ft radius circle centered on you (that does not move with you). Creatures inside the circle have their range tripled. For spells and attacks with melee range the range becomes 30 ft (all attacks have a shadow extension that casts them at the mentioned range).","tags":["aoe"]},{"id":"corruption","name":"Corruption","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":4,"mana":215,"range":"60 ft","duration":null,"mech":"4d12 + 50 + 4×mod shadow","desc":"You cast a shadow ray on a creature within range that is affected by at least 3 shadow effects (shadow damage over time, or cc cast by necromancer etc.). All the shadow effects end and the creature takes [4 x spell modifier + 50 + 4d12] + [4 x spell modifier + 25 + 4d12] / shadow effect ended shadow damage and you heal for half the damage dealt.","tags":["damage","healing","shadow"]},{"id":"dark-passage","name":"Dark passage","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":4,"mana":160,"range":"30 ft","duration":"1 min","mech":"concentration","desc":"You enter a corpse (or skeleton) for the duration and control its MS. You are immune for the duration. On one of your turns or when the skeleton would die you exit the corpse teleporting up to 10 ft in a direction.","tags":["defense","movement"]},{"id":"essence-leech","name":"Essence leech","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":2,"mana":155,"range":"30 ft","duration":"3 turns","mech":"concentration","desc":"You consume a corpse, absorbing their essence. You become resistant to all types of magic damage that you are currently normal to.","tags":["defense"]},{"id":"mist-of-the-necromancer","name":"Mist of the necromancer","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":2,"mana":150,"range":"90 ft","duration":"1 hour","mech":"concentration","desc":"You cover a 60 ft radius area in green mist. The mist obscures the area heavily, but can be seen through (causing disadvantage on attack rolls). If you channel for 1 minute you can cover up 6000 ft radius in mist.","tags":["debuff","ritual","aoe"]},{"id":"rotting-infestation","name":"Rotting infestation","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":3,"mana":150,"range":"60 ft","duration":null,"mech":"savingThrow · CONST save","desc":"You explode a corpse, creating a rotting cloud of stench in a 10 ft area around it. Creatures in the area must succeed on a Const saving throw or be knocked prone (pucking) and become decaying until the end of your next turn (taking damage from healing).","tags":["healing","control","aoe"]},{"id":"void-feast","name":"Void feast","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":4,"ap":3,"mana":160,"range":"60 ft","duration":"10 min","mech":"4d8 + 34 + 4×mod shadow","desc":"You cast the void upon a creature within ":220,"range":"30 ft","duration":"3 turns","mech":"10d10 + 55 + 5×mod · heals 10d10 + 55 + 5×mod · concentration","desc":"You consume a corpse, consuming their heart. For the duration you are immune to being terrified, mind-controlled, charmed, mad, sleeping and you heal for [5 x spell modifier + 55 + 10d10] at the start of each of your turns.","tags":["damage","healing","control","defense"]},{"id":"dark-exchange","name":"Dark exchange","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":5,"ap":2,"mana":250,"range":"60 ft","duration":null,"mech":"","desc":"Choose a creature secretly. For 1 round (or until the end of your next turn if the chosen creature is you) damage and healing are swapped (the creature is damaged by healing and healed by damage - both ignoring armor and resistances). Creatures that damage/heal the chosen creature are unaware that the creature has them reversed.","tags":["healing","defense"]},{"id":"wicked-revive","name":"Wicked revive","classId":"necromancer","cls":"Necromancer","path":"Corruptor","level":5,"ap":6,"mana":300,"range":"30 ft","duration":null,"mech":"","desc":"You can consume the life of an innocent creature (child, herbivore animal, true priest, etc.) to bring a dead creature to life in a mauled, deformed shape. The creature retains its knowledge, thoughts, ideas etc. from before death. You have no control over the creature. The creature’s fighting capabilities may be restricted or enhanced (neither for allies). This can be done even if the creature lost the fight with death.","tags":["healing","buff"]},{"id":"earth-shock","name":"Earth Shock","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":1,"ap":3,"mana":10,"range":"60 ft","duration":"3 rounds","mech":"2d6 + 13 + mod force · savingThrow · CONST save","desc":"You channel the weight and inevitability of the earth, sending a crushing force through your target. The target must succeed on a Constitution saving throw, or take [spell modifier + 13 + 2d6] force damage and have its movement speed reduced by [10] while moving toward you for the duration.","tags":["damage","debuff","defense","movement","force"]},{"id":"magic-blast","name":"Magic Blast","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":1,"ap":3,"mana":5,"range":"60 ft","duration":null,"mech":"2d10 + 12 + mod · savingThrow · WILL save","desc":"You draw raw energy from the arcane veil and release it in a focused surge toward your foe. The target must succeed on a [Const, Int, Wis, Dex] saving throw (based on your current spirit), or on a Will saving throw if you have no spirit, or take [spell modifier + 12 + 2d10] damage of your spirit’s damage type [crushing, fire, lightning, spectral], or pure if you have no spirit. This spell can be cast again in the same turn.","tags":["damage","defense"]},{"id":"phantasmagorical-spirit","name":"Phantasmagorical Spirit","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":1,"ap":1,"mana":10,"range":"60 ft","duration":"1 minute","mech":"channeling","desc":"You blur the boundary between your spirit’s physical shape and the arcane veil from which you created it. It enters a ghost-like intangible state. For the duration, the spirit can move through solid objects and creatures, and its vision range becomes 20 ft. While active, you may channel to see through your spirit’s eyes. While doing so, your body becomes unconscious and unaware of its surroundings. If the spirit moves more than [200 ft] away from you, the effect ends immediately and the spirit is unsummoned (this does not consume your summon; see Summon Spirit).","tags":["control","movement","summon"]},{"id":"protective-energy","name":"Protective Energy","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":1,"ap":1,"mana":5,"range":"60 ft","duration":"1 min","mech":"2d4 · concentration","desc":"You conjure a hovering shard of protective energy that lingers above an ally, ready to intercept incoming harm. When the target is damaged by a direct ability (not damage over time or secondary instances of the same ability), and is within 20 ft of your spirit, it gains [2d4] temporary HP lasting until the end of combat.","tags":["damage","defense","summon"]},{"id":"spiked-weapon","name":"Spiked Weapon","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":1,"ap":1,"mana":5,"range":"60 ft","duration":"1 min","mech":"2d6 + 7 + mod piercing · concentration","desc":"You anchor a jagged construct of condensed arcane energy into the battlefield, its presence threatening any who move too close. While active, when a creature leaves the space within 5 ft of the construct, you may use your reaction to make an attack of opportunity against it. On hit, the target takes [spell modifier + 7 + 2d6] piercing damage. You may spend 1 AP to move the construct up to 30 ft. You must be within range to do so.","tags":["damage","summon"]},{"id":"spirit-strike","name":"Spirit Strike","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":1,"ap":4,"mana":10,"range":"5 / 90 / 5 / 5","duration":null,"mech":"2d8 + 9 + mod · heals 3d8 · spiritAttack","desc":"You issue a sharp command, and your spirit lunges to strike with its own nature. Your spirit makes an attack roll. On hit, it deals [spell modifier + 9 + 2d8] damage of its type and applies an additional effect: Earth: the spirit heals for the damage dealt​ Fire: the target gains a [3d8] Burning effect lasting 2 rounds​ Lightning: the target gains [1] Dazed stack​ Spectral: the target gains [1] Prone stack","tags":["damage","healing","control"]},{"id":"wild-attack","name":"Wild Attack","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":1,"ap":1,"mana":5,"range":"90 ft","duration":null,"mech":"lightning","desc":"You unleash a fragment of your spirit’s untamed nature, granting it a sudden, instinctive surge of power. Your spirit gains one use of the following (based on its type): Earth: 0 AP - next attack applies [2] Taunted stacks (on hit)​ Fire: 0 AP - next attack has advantage​ Lightning: 0 AP - next attack becomes a 90 ft lightning bolt, dealing the combined damage of an attack with both claws in a single instance as lightning damage​ Spectral: 0 AP - next attack becomes a dash, allowing the spirit to move up to 20 ft as part of the attack This spell can be cast again in the same turn at no mana cost, but only after the previous Wild Attack has been used.","tags":["damage","buff","control","movement","lightning"]},{"id":"cunning-spirit","name":"Cunning spirit","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":2,"ap":1,"mana":50,"range":"60 ft","duration":null,"mech":"","desc":"You enhance your spirit, making it more elusive. Your spirit removes one negative effect affecting it, and nullifies the first negative effect (not the damage that caused it) that would affect it.","tags":["buff"]},{"id":"energy-of-swiftness","name":"Energy of swiftness","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":2,"ap":2,"mana":60,"range":"90 ft","duration":"1 min","mech":"concentration","desc":"You create a windy artefact on top of a creature. At the end of each of your turns, the artefact grants the creature +[4] bonus AC for a round. For 1 ap, you can move the artefact to another creature within range.","tags":["movement"]},{"id":"exploding-darkness","name":"Exploding darkness","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":2,"ap":3,"mana":60,"range":"60 ft","duration":null,"mech":"4d8 + 29 + 2×mod shadow","desc":"You shoot a projectile of dark energy at an enemy within range. On a hit, the orb explodes and all creatures within 10 ft of the target, including the target, take [2 x spell modifier + 29 + 4d8] shadow damage.","tags":["damage","aoe","shadow"]},{"id":"force-crush","name":"Force crush","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":2,"ap":3,"mana":55,"range":"90 ft","duration":null,"mech":"4d10 + 33 + 2×mod force · savingThrow · STR save","desc":"You force a creature within range to make a Str saving throw. On a fail, the creature takes [2 x spell modifier + 33 + 4d10] force damage and is pushed up to 15 ft towards your spirit.","tags":["damage","control","defense","force"]},{"id":"magic-imbue","name":"Magic imbue","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":2,"ap":1,"mana":55,"range":"90/90/90/90","duration":null,"mech":"fire","desc":"You unlock 2 use(s) of the following spell for your spirit (you must choose one spell that is granted at the moment of the cast) Fire spirit: any elementalist or battlecaster spell of the same level that deals fire damage Earth spirit: any guardian or druid spell of the same level Lightning spirit: any elementalist or stormbringer spell of the same level that deal lightning damage Spectral spirit: any phantom special attack (special attack 1 for 2nd level spell; special attack 2 for 3rd level spell; special attack 3 for 4th level spell or higher); the spirit is considered in the right form to apply the mark and then prock it with a different attack, without needing to consume any ap to change forms;","tags":["damage","defense","fire"]},{"id":"shadow-energy","name":"Shadow energy","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":2,"ap":1,"mana":50,"range":"60 ft","duration":"1 min","mech":"2d8 + 8 + 2×mod shadow · savingThrow · DEX save · concentration","desc":"You create a dark artefact covered in shadows at a point within range. For the duration you can use the spirit weapon once per turn for 1 ap to force ALL creatures within 10 ft of the weapon to roll a dex saving throw.. On a fail, a target takes [2 x spell modifier + 8 + 2d8] shadow damage. For 1 ap you can move the weapon up to 30 ft. (but you must be in [range] ft of it to cast this).","tags":["damage","movement","aoe","shadow"]},{"id":"spirit-lash","name":"Spirit lash","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":2,"ap":3,"mana":65,"range":"90/90/90/90","duration":null,"mech":"3d12 + 19 + 2×mod spectral · savingThrow · CONST save","desc":"You instantly command your spirit to strike a foe within range. Your spirit rolls an attack against the target, and on a hit deals [2 x spell modifier + 19 + 3d12] spirit damage. Fire spirit: the target has its PA reduced by [15] for a round. Earth spirit: the target must succeed on a Const saving throw or be rooted for a round Lightning spirit: the target has its resistance to lightning reduced by one level for a round Spectral spirit: the spirit’s next attack on the target will deal [5d8] additional spectral damage]","tags":["damage","debuff","control","defense","spectral"]},{"id":"banish","name":"Banish","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":3,"ap":2,"mana":105,"range":"90 ft","duration":"3 turns","mech":"savingThrow · CHA save","desc":"You force a creature within range to make a Cha saving throw. On a fail, the creature is banished (turned ethereal) for up to 3 turns. An ethereal creature takes half damage from physical sources, but double from magic. The creature can repeat the saving throw at the end of each of their turns.","tags":["control"]},{"id":"elemental-powers","name":"Elemental powers","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":3,"ap":3,"mana":110,"range":"90 ft","duration":null,"mech":"6d6 + 23 + 3×mod fire · spiritAttack","desc":"You unlock 2 USES of your spirit’s elemental power for your spirit (the spirit must be in range for the cast). Fire spirit: Melting doom (3 ap) - your spirit spits lava in a 10 ft wide 100 ft long line in a direction that lasts for up to 3 turns; all creatures that starts its turn in the lava, or move through it (they take the damage for every ap of movement - at the first step of the ap) automatically takes [3 x spell modifier + 23 + 6d6] fire damage (normally ignores armor) Earth spirit: Shockwave (3 ap) - your spirit slams the ground, forcing all enemies within 30 ft to roll a str saving throw; on a fail they take [3 x spell modifier + 60 + 6d8] force damage and are pulled to the nearest unoccupied space to next to the spirit Lightning spirit: Lightning onslaught (4 ap) your spirit makes 5 attacks on a target (requiring attack roll), each dealing [3 x spell modifier + 11 + 3d10] lightning damage and reducing the target’s ap by 1 Spectral spirit: Spectral breath (3 ap) - your spirit breaths a wave of spectral energy in a 15 ft long cone in front of it; all creatures within range must roll a dex saving throw; on a fail they take [3 x spell modifier + 50 + 6d12] spectral damage, and on a success they take half the amount;","tags":["damage","control","movement","aoe","fire"]},{"id":"forced-kneel","name":"Forced kneel","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":3,"ap":3,"mana":110,"range":"30 ft","duration":null,"mech":"3d10 + 35 + 3×mod force · savingThrow · CONST save","desc":"You force a creature within range to make a Const saving throw. On a fail, the creature takes [3 x spell modifier + 35 + 3d10] force damage and is knocked prone.","tags":["damage","control","force"]},{"id":"hasting-energy","name":"Hasting energy","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":3,"ap":2,"mana":100,"range":"60 ft","duration":"1 min","mech":"concentration","desc":"You create a glowing artifact of light on top of a creature. That creature has [2] increased ap recovery. For 1 ap you can move the artifact to another creature.","tags":["movement"]},{"id":"siege-weapon","name":"Siege weapon","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":3,"ap":0,"mana":180,"range":"120 ft","duration":"1 min","mech":"8d20 + 100 crushing · concentration","desc":"You create a giant artifact, similarly looking to a giant ram. For the duration you can use the spirit weapon once per turn for 6 ap to attack a creature within range. The attack automatically hits, and deals [100 + 8d20] crushing damage. This damage is doubled against constructs, and quadrupled against structures and objects.","tags":["damage","summon"]},{"id":"spirit-onslaught","name":"Spirit onslaught","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":3,"ap":4,"mana":135,"range":"60/5/5/5","duration":null,"mech":"6d12 + 48 + 3×mod","desc":"You instantly command your spirit to strike a foe within range. Your spirit rolls an attack against the target, and on a hit deals [3 x spell modifier + 48 + 6d12] spirit damage. Fire spirit: the attack deal another [2d12] damage for every [10 ft] range between the spirit and the target Earth spirit: the attack deals another [2d12] damage for every [50] current hp your spirit has Lightning spirit: the attack deals another [2d12] damage for every [50] missing hp your target has Spectral spirit: the attack also reduces the target’s PA and MA until the end of their turn for [2d12] for every time your spirit damaged them since the end of your last turn","tags":["damage","defense"]},{"id":"spirit-wings","name":"Spirit wings","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":3,"ap":1,"mana":35,"range":"120 ft","duration":"3 turns","mech":"","desc":"You enhance your spirit, giving it [30] flying speed for the duration.","tags":["buff","movement"]},{"id":"occult-blast","name":"Occult blast","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":4,"ap":3,"mana":150,"range":"90 ft","duration":null,"mech":"8d10 + 58 + 4×mod shadow · ranged spell attack","desc":"Make a ranged attack against a creature. On a hit, the target takes [4 x spell modifier + 58 + 8d10] shadow damage. If the target is affected by a negative effect, the attack automatically hits. For every additional negative effect affecting the target (beyond the first), the attack deals [4d10] additional damage","tags":["damage","buff","shadow"]},{"id":"spirit-rage","name":"Spirit rage","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":4,"ap":3,"mana":160,"range":"90 ft","duration":null,"mech":"","desc":"You unlock 3 USES of your spirit’s special rage power for your spirit (the spirit must be in range for the cast). Fire spirit: 0 ap, for 1 round the spirit deals x1.5 damage, but takes x1.5 damage; Earth spirit: 0 ap; for 1 round, the spirit doubles its armor, but deals no more modifier damage with its attacks (or commands/abilities that occur through it). Lightning spirit: 0 ap; for 1 round, the spirit has doubled ap recovery, but it automatically fails all saving throws and all attacks automatically hit it; Spectral spirit: 0 ap; for 1 round, the spirit heals for 100% of the damage it deals (or damage dealt through commands/abilities that occur through it), but has its PA and MA reduced to 0.","tags":["healing","defense"]},{"id":"spirit-signature","name":"Spirit signature","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":4,"ap":6,"mana":170,"range":"90/5/5/-","duration":null,"mech":"8d12 + 170 + 4×mod fire · savingThrow · DEX save","desc":"You instantly command your spirit to use their signature ability. Fire spirit: spits a giant fireball at a point within range. all creatures within 30 ft roll a dex saving throw, taking [4 x spell modifier + 170 + 8d12] fire damage on a fail, or half as much on a success Earth spirit: forces all enemy targets within 30 ft to make a will saving throw or be taunted for up to 3 turns; they can repeat the saving throw at the end of every turn; while any creature is still taunted, the spirit reduces all received by half (after all other reductions) Lightning spirit: deals [4 x spell modifier + 140 + 8d12] lightning damage and forces the target to succeed on a const saving throw or be stunned for a turn; Spectral spirit: Absorb essence - the spirit deals [4 x spell modifier + 98 + 8d10] spectral damage to all enemies within 20 ft, and heals for half the damage dealt","tags":["damage","healing","control","defense","aoe","fire"]},{"id":"spirit-swap","name":"Spirit swap","classId":"spirit-master","cls":"Spirit Master","path":"Corruptor","level":4,"ap":1,"mana":160,"range":"120 ft","duration":null,"mech":"","desc":"You move your spirit up to 30 ft, then switch places with it.","tags":["movement"]},{"id":"blood-fountain","name":"Blood fountain","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":2,"mana":10,"range":"10 ft","duration":null,"mech":"","desc":"You convert a surface of water (surface or puddle, not lakes or such) to blood.","tags":["utility"]},{"id":"cursed-lightning","name":"Cursed lightning","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":3,"mana":12,"range":"60 ft","duration":null,"mech":"2d8 + 13 + mod lightning · savingThrow · DEX save","desc":"Your overlord causes a cursed lightning to strike a target within range. The target must succeed on a dex saving throw or take [spell modifier + 13 + 2d8] lightning damage and have a [spell modifier] penalty to their next roll (attack, damage, save, etc).","tags":["damage","debuff","lightning"]},{"id":"dark-curse","name":"Dark curse","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":1,"mana":15,"range":"60 ft","duration":"1 min","mech":"1d4 + mod shadow","desc":"Your overlord curses a creature within range. For the duration the target takes [spell modifier + 1d4] additional shadow damage whenever you damage the target (is considered overlord damage).","tags":["damage","debuff","shadow"]},{"id":"dark-tentacles","name":"Dark tentacles","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":2,"mana":15,"range":"self","duration":"1 min","mech":"1d6 + 5 + mod crushing · savingThrow · STR save","desc":"Dark tentacles surround you. The first time an enemy creature comes within 10 ft of you the tentacles attempt to attack the target. The target must succeed on a Str saving throw or take [spell modifier + 5 + 1d6] crushing damage and be grabbed by the tentacles - which effectively roots them (the tentacles will automatically release them at the end of their next turn if they are unable to release themselves until then).","tags":["damage","control"]},{"id":"demons-tongue","name":"Demon’s tongue","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":2,"mana":10,"range":"self","duration":null,"mech":"1d4 + 1","desc":"You can add [1d4 + 1] to your next persuasion, seduction, deception, intimidation check.","tags":["damage"]},{"id":"doom-bolt","name":"Doom bolt","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":3,"mana":15,"range":"30 ft","duration":"1 min","mech":"2d10 + 14 + mod lightning · ranged spell attack · concentration","desc":"Make a ranged spell attack on a target within range. On a hit the target takes [spell modifier + 14 + 2d10] lightning damage. On a hit you can choose to concentrate on the spell. If you do so you can cast this spell once on each of your turns with no mana cost (on the same target). If you do not cast it on one of your turns the effect ends and you lose concentration.","tags":["damage","lightning"]},{"id":"eldritch-blast","name":"Eldritch blast","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":3,"mana":5,"range":"60 ft","duration":null,"mech":"2d10 + 10 + mod force · ranged spell attack","desc":"Make a ranged spell attack on a target within range. On a hit the target takes [spell modifier + 10 + 2d10] force damage.","tags":["damage","force"]},{"id":"infernal-vengeance","name":"Infernal vengeance","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":0,"mana":10,"range":"60 ft","duration":null,"mech":"2d4 + 3 + mod fire","desc":"Your overlord causes hellish flames to engulf a target who just damaged you. The target takes [spell modifier + 3 + 2d4] fire damage (counts for your last turn for hellish pain).","tags":["damage","fire"]},{"id":"mosquito-swarm","name":"Mosquito swarm","classId":"warlock","cls":"Warlock","path":"Corruptor","level":1,"ap":3,"mana":12,"range":"30 ft","duration":null,"mech":"2d12 + 12 + mod piercing · savingThrow · CONST save","desc":"You send forth a swarm of mosquitos upon a target. The target must succeed on a Const saving throw or take [spell modifier + 12 + 2d12] piercing damage.","tags":["damage"]},{"id":"curse-of-fright","name":"Curse of fright","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":1,"mana":50,"range":"30 ft","duration":"3 turns","mech":"psychic · savingThrow · WILL save","desc":"Your overlord curses a target with fright. Everytime the creature damages you they must succeed on a Will saving throw or become terrified until the end of their turn.","tags":["damage","debuff","psychic"]},{"id":"cursed-ground","name":"Cursed ground","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":2,"mana":55,"range":"30 ft","duration":"1 min","mech":"poison · concentration","desc":"You mark a point within range. The 15 ft area around it becomes cursed ground. Whenever a creature starts their turn in the area they must succeed on a Str saving throw or become rooted for the rest of their turn.","tags":["damage","debuff","control","poison"]},{"id":"demonic-serpent","name":"Demonic serpent","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":3,"mana":55,"range":"30 ft","duration":null,"mech":"2d8 + 18 + 2×mod piercing","desc":"Your overlord creates a small poisonous snake at a point within range that attempts to bite a target next to it and then vanishes. The snake makes a spell attack against a target within 5 ft of it. On a hit the target takes [2 x spell modifier + 18 + 2d8] piercing damage, and [2 x spell modifier + 18 + 2d8] poison damage at the start of their turn.","tags":["damage"]},{"id":"expanding-shadows","name":"Expanding shadows","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":4,"mana":80,"range":"self","duration":null,"mech":"5d10 + 44 + 2×mod shadow","desc":"You create a spear of darkness that you throw in a direction. The spear travels for 60 ft (60 ft long line 5 ft wide). Each creature in the path must succeed on a dex saving throw or take [2 x spell modifier + 44+ 5d10] shadow damage.","tags":["damage","aoe","shadow"]},{"id":"fire-whip","name":"Fire whip","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":3,"mana":55,"range":"30 ft","duration":null,"mech":"3d12 + 26 + 2×mod fire · savingThrow · CONST save","desc":"You create a magic fire whip to strike a foe within range. The target must succeed on a const saving throw, or take [2 x spell modifier + 26 + 3d12] fire damage and be blinded for 1 turn.","tags":["damage","control","fire"]},{"id":"hellfire","name":"Hellfire","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":3,"mana":60,"range":"self","duration":null,"mech":"6d8 + 21 + 2×mod fire · savingThrow · DEX save","desc":"Your overlord casts a wave of fire in a 20 ft radius centered on you (or the avatar if available). All enemy creatures in range must succeed on a Dex saving throw or take [2 x spell modifier + 21 + 6d8] fire damage.","tags":["damage","aoe","fire"]},{"id":"rain-blood","name":"Rain blood","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":1,"mana":50,"range":"30 ft","duration":null,"mech":"","desc":"Your overlord rains blood in a 30 ft radius area centered on a point within range (clear surfaces in the area become blood surfaces).","tags":["aoe"]},{"id":"shadow-walk","name":"Shadow walk","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":3,"mana":60,"range":"self","duration":"up to 1 min","mech":"channeling","desc":"While you channel (you are able to move) you are invisible. A passive investigation against your spell DC might make a creature realise there is a presence, but they cannot see you. An investigation check can detect your position. Truesight and such sees you. If you touch or bump into a creature (not push or shove or knock back/prone) the creature doesn’t realise you are there and doesn’t pay much thought to the event, unless their passive investigation (or check) succeeded against your spell DC, in which case you are “revealed” to them.","tags":["control"]},{"id":"tides-of-blood","name":"Tides of blood","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":4,"mana":75,"range":"self","duration":null,"mech":"2d10 + 28 + 2×mod piercing · savingThrow · CONST save","desc":"You cast a wave of daggers of blood to strike all enemy foes within 15 ft of you. Any enemy within range must succeed on a const saving throw or take [2 x spell modifier + 28 + 2d10] piercing damage. If the target has blood (is not a construct, undead, etc) they become linked to all the other creatures with blood damaged by the spell. Until the end of your next turn, if one of the affected creatures deals damage to you, the same amount (after reductions) is dealt as true damage to all the other affected creatures.","tags":["damage","summon"]},{"id":"wicked-wall","name":"Wicked wall","classId":"warlock","cls":"Warlock","path":"Corruptor","level":2,"ap":2,"mana":60,"range":"30 ft","duration":"1 min","mech":"savingThrow · WILL save · concentration","desc":"You create a 60 ft long 20 ft tall wall of darkness centered on a point within range. Enemies cannot pass through the walls, allies (including you) must succeed on a Will saving throw in order to pass through it, but all enemy attacks that pass through the wall deal double damage.","tags":["debuff"]},{"id":"black-shroud","name":"Black shroud","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":2,"mana":105,"range":"30 ft","duration":"1 min","mech":"concentration","desc":"You create a black shroud in a 15 ft radius area centered on a point within range. Creatures in the shroud are silenced and suffocating (these effects persist for all of the turn, even if the creature leaves the shroud).","tags":["control","aoe"]},{"id":"dark-omen","name":"Dark omen","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":2,"mana":75,"range":"30 ft","duration":"1 min","mech":"6d8 + 34 + 3×mod psychic · savingThrow · WIS save","desc":"You force a creature to make a Wis saving throw. On a fail they are affected by shadow vision for the duration. A creature can end the effect early if they deal damage to an ally (themselves included), in which case they take [3 x spell modifier + 34 + 6d8] psychic damage, or if they kill an opponent, in which case they take no damage.","tags":["damage","psychic"]},{"id":"death-wish","name":"Death wish","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":2,"mana":100,"range":"self","duration":"3 turns","mech":"","desc":"For the duration the thirst for blood runs in your veins. If you are below 50% of your max HP you deal 1.5 x damage with every ability. If you are below 10% of your max HP you deal 2 x damage with every ability.","tags":["utility"]},{"id":"demonic-apparition","name":"Demonic apparition","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":2,"mana":100,"range":"self","duration":"1 hour","mech":"","desc":"You can summon a demonic apparition of your overlord. The apparition does not fight but it can aid you with a task (check if a room is safe, scare off peasants, etc.)","tags":["summon","ritual"]},{"id":"eldritch-wave","name":"Eldritch wave","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":4,"mana":135,"range":"self","duration":null,"mech":"6d6 + 12 + 3×mod force · savingThrow · CONST save","desc":"You create a wave of eldritch force around you. All enemy creatures within 15 ft of you must succeed on a const saving throw or take [3 x spell modifier + 12 + 6d6] force damage and become snared until the end of your next turn.","tags":["damage","aoe","force"]},{"id ediction","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":3,"mana":100,"range":"30 ft","duration":null,"mech":"6d10 + 23 + 3×mod shadow · savingThrow · CHA save","desc":"You curse the enemies in a 10 ft radius area centered on a point within range. Enemy targets in the area must succeed on a Cha saving throw or become cursed (they still take half damage on a success). At the start of their next turn they will take [3 x spell modifier + 23 + 6d10] shadow damage.","tags":["damage","debuff","aoe","shadow"]},{"id":"pyre","name":"Pyre","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":6,"mana":200,"range":"30 ft","duration":"3 turns","mech":"3d12 + 56 + 3×mod fire · savingThrow · WILL save · channeling","desc":"You attempt to force a creature on a magical pyre that you create, practically suppressing the target (incapacitated condition). The target must succeed on a Will saving throw or become tied to the pyre. For the duration at the start of each of the creature’s turns they take [3 x spell modifier + 56 + 3d12] fire damage, that IS reduced by armor. The target repeats the saving throw at the end of each of their turns, ending the effect on both of you. The target must be of size “large” or lower.","tags":["damage","debuff","control","fire"]},{"id":"sword-of-the-demon-king","name":"Sword of The Demon King","classId":"warlock","cls":"Warlock","path":"Corruptor","level":3,"ap":4,"mana":135,"range":"self","duration":null,"mech":"6d12 + 54 + 3×mod fire · savingThrow · DEX save","desc":"You create a gigantic flame sword that you control using telekinesis. You smash it to the ground in a direction in front of you. The sword hit a 60 ft long 10 ft wide line. Creatures hit must succeed on a dex saving throw or take [3 x spell modifier + 54 + 6d12] fire damage and be forced to make a const saving throw or get knocked prone.","tags":["damage","control","fire"]},{"id":"blood-starvation","name":"Blood starvation","classId":"warlock","cls": ely realises something is wrong with them. At the same time the target’s fighting capabilities are reduced to 0.","tags":["debuff","ritual"]},{"id":"grasp-of-the-starved","name":"Grasp of the starved","classId":"warlock","cls":"Warlock","path":"Corruptor","level":4,"ap":4,"mana":160,"range":"60 ft","duration":null,"mech":"8d12 + 80 + 4×mod spectral · savingThrow · STR save","desc":"You summon the dead to aid you. All enemy creatures within range standing on blood are attacked by spectral hands that spring from the ground. They must roll str saving throws. On a fail, a creature takes [4 x spell modifier + 80 + 8d12] spectral damage and is rooted for 1 turn. On a success they only take half damage.","tags":["damage","control","summon","aoe","spectral"]},{"id":"locust-horde","name":"Locust horde","classId":"warlock","cls":"Warlock","path":"Corruptor","level":4,"ap":3,"mana":160,"range":"60 ft","duration":null,"mech":"24d4 + 4×mod piercing · savingThrow · CONST save","desc":"Your overlord calls a horde of locust-like insects. The wave affects a 60 ft side cube. All enemy creatures must roll a const saving throw. On a fail they take [4 x spell modifier + 24d4] piercing damage and insects enter their armor (if they are wearing armor). They must remove their armor, clean it and requip it (a total of 6 ap) to get rid of the insects. While a creature has insects in their armor they take [12d4] piercing damage at the start of each of their turns. On a success they only take half damage.","tags":["damage"]},{"id":"meteorite-rain","name":"Meteorite rain","classId":"warlock","cls":"Warlock","path":"Corruptor","level":4,"ap":3,"mana":170,"range":"60 ft","duration":null,"mech":"2d10 + 36 + 2×mod fire · savingThrow · DEX save","desc":"Your overlord sends rain of burning meteorites on a 30 ft area centered on a point within range. All creatures in the area must roll a dex saving throw, taking [2 x spell modifier + 36 + 2d10] crushing damage and [2 x spell modifier + 36 + 2d10] fire vice. You heal to full HP. For the duration all healing and damage (except for this spell’s) you receive is reduced to 0, you take 25% of your max HP as true damage at the end of every turn, all the spells you cast are empowered, your AC, all your armors and resistances become 0 (you also cannot benefit from any sort of shield, immunity buff or temporary HP). If combat ends this effect ends instantly. (cannot be cast out of combat; combat is considered ended only if your opponents are defeated)","tags":["healing","buff","defense"]},{"id":"back-from-the-edge","name":"Back from the Edge","classId":"cleric","cls":"Cleric","path":"Disciple","level":1,"ap":2,"mana":15,"range":"30 ft","duration":null,"mech":"","desc":"Restore an unconscious creature within range to 1 HP without Medicine check. Placed last in initiative. Unavailable if campaign uses instant death.","tags":["control"]},{"id":"divine-chastise","name":"Divine Chastise","classId":"cleric","cls":"Cleric","path":"Disciple","level":1,"ap":3,"mana":5,"range":"60 ft","duration":null,"mech":"","desc":"Apply 1 weakened stack to a creature. Double stacks if you are severely injured. Scaling: +1 weakened stack per level.","tags":["debuff"]},{"id":"energy-sacrifice","name":"Energy Sacrifice","classId":"cleric","cls":"Cleric","path":"Disciple","level":1,"ap":3,"mana":10,"range":"90 ft","duration":null,"mech":"","desc":"Grant a creature within range 2 additional AP at the start of its next turn.","tags":["utility"]},{"id":"healing-touch-withering-touch","name":"Healing Touch / Withering Touch","classId":"cleric","cls":"Cleric","path":"Disciple","level":1,"ap":3,"mana":10,"range":"melee","duration":null,"mech":"[object Object] + 12 + mod shadow · heals [object Object] + 12 + mod · melee spell attack","desc":"Healing: heal ally in melee for [spell mod + 12 + 3d10]. Necrotic: melee spell attack dealing [spell mod + 12 + 3d10] shadow damage.","tags":["damage","healing","debuff","shadow"]},{"id":"healing-word","name":"Healing .","tags":["damage","aoe","thunder"]},{"id":"the-final-act","name":"The Final Act","classId":"virtuoso","cls":"Virtuoso","path":"Musician","level":7,"ap":1,"mana":300,"range":"120 ft","duration":null,"mech":"savingThrow · CHA save","desc":"You and the target both roll a CHA save. If target has over 1000 HP you fall unconscious for 1 minute. If it has less and you win, it dies. If you lose, you are banished into nothingness and reborn after 1d4 weeks at your last safe location.","tags":["control"]},{"id":"land-of-the-veil","name":"Land of the Veil","classId":"virtuoso","cls":"Virtuoso","path":"Musician","level":8,"ap":2,"mana":300,"range":"200 ft","duration":"10 minutes","mech":"concentration","desc":"You transport all creatures in range into a veil-created space of similar size. You design every detail. While in the veil your range is doubled, MS tripled, and you have advantage on saving throws. No additional creatures can be added.","tags":["movement","aoe"]},{"id":"sacrifice-of-the-veiled-virtuoso","name":"Sacrifice of the Veiled Virtuoso","classId":"virtuoso","cls":"Virtuoso","path":"Musician","level":8,"ap":0,"mana":0,"range":"self","duration":null,"mech":"","desc":"You turn back time to a point of your choice. All things are as they were. You are the only person aware of this. After casting, roll 1d4. On a 1, you are obliterated and your mind and soul are absorbed by the veil.","tags":["defense"]},{"id":"tales-of-grandest-heroes","name":"Tales of Grandest Heroes","classId":"virtuoso","cls":"Virtuoso","path":"Musician","level":8,"ap":4,"mana":500,"range":"self","duration":"10 minutes","mech":"","desc":"Roll 1d6 to determine a class (1=musician, 2=disciple, 3=wildborn, 4=corruptor, 5=wizard, 6=battlemage). You can cast any spell of any subclass from the rolled class for the duration. Does not stack.","tags":["utility"]},{"id":"glyph-of-danger","name":"Glyph of danger","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":1,"ap":"1 or 2","ma ":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":1,"ap":1,"mana":5,"range":"30 ft","duration":"3 turns","mech":"1d6 + 4 + mod shadow","desc":"Apply: You mark a creature within range. Prock condition: The first time you damage the creature (any amount). Prock effect: the triggering ability deals an additional [spell modifier + 4 + 1d6] shadow damage","tags":["damage","shadow"]},{"id":"shiv-throw","name":"Shiv throw","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":1,"ap":3,"mana":10,"range":"30 ft","duration":null,"mech":"2d12 + 15 + mod piercing · ranged spell attack","desc":"You throw a shadow shiv in a direction. Make a ranged spell attack against the first target in its path (within range). On a hit the target takes [spell modifier + 15 + 2d12] piercing damage.","tags":["damage"]},{"id":"jack-in-the-box","name":"Jack in the box","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":2,"ap":3,"mana":60,"range":"10 ft","duration":"3 turns","mech":"ice · WILL save","desc":"You place down a box (cube with side of 1 ft), you choose how it looks. You can choose to make the box invisible (is detected by investigation against your spell DC). The first time a creature comes within 5 ft of the box a shadowy figure appears from it and all creatures within 10 ft of it must succeed on a will saving throw or be frightened for the duration (can repeat the saving throw at the end of each turn). Attacking a frightened creature deals an additional dice damage. If the frighten...","tags":["damage","control","aoe","ice"]},{"id":"mark-of-elemental-destruction","name":"Mark of elemental destruction","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":2,"ap":1,"mana":65,"range":"20 ft","duration":"1 minute","mech":"","desc":"Apply: You mark a creature within range that is able to cast magic. Prock condition: The creatures deals 3 different types of damage (to any creature, at any point after ":"12d12 + 102 + 4×mod shadow","desc":"Apply: You mark an object within range that noone is holding, or a spot on the ground within range that noone is occupying. Prock condition: The first time a creature touches it. Prock effect: the creature takes [4 x spell modifier + 102 + 12d12] shadow damage and the creature is always considered to be in shadows for up to 1 hour.","tags":["damage","shadow"]},{"id":"mark-of-the-titan","name":"Mark of the titan","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":4,"ap":1,"mana":110,"range":"10 ft","duration":"1 min","mech":"","desc":"Apply: You mark a creature within range with PA AND MA higher than your weapon’s avg damage attack. Prock condition: You deal 150 damage to the creature in a single round. Prock effect: you ignore the creature’s PA and MA for the next 3 rounds","tags":["defense"]},{"id":"orb-of-darkness","name":"Orb of darkness","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":4,"ap":3,"mana":160,"range":"20 ft","duration":null,"mech":"14d10 + 98 + 4×mod shadow","desc":"You throw an orb in a direction by exactly [range] ft. At the start of your next turn the orb explodes dealing [4 x spell modifier + 98 + 14d10] shadow damage to all creatures within 15 ft of it.","tags":["damage","aoe","shadow"]},{"id":"shadow-dive","name":"Shadow dive","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":4,"ap":2,"mana":100,"range":"90 ft","duration":null,"mech":"6d8 + 31 + 4×mod shadow · DEX save","desc":"You become a shadow and go into the sky. You can, at any point until the start of your next turn (when this is recast automatically), choose a point within range and dive there. All creatures within 10 ft of the landing spot must roll a dex saving throw, taking [4 x spell modifier + 31 + 6d8] shadow damage on a fail, or half as much on a success. Shadow diving on a creature doing an interruptible attack will interrupt the attack if they fail the saving throw.","tags":["damage","aoe","shadow"]},{"id":"shadow-realm","name":"Shadow realm","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":4,"ap":1,"mana":150,"range":"100ft","duration":"3 turns","mech":"shadow","desc":"You cover all terrain within range in shadows for the duration.","tags":["damage","shadow"]},{"id":"shadow-suggestion","name":"Shadow suggestion","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":4,"ap":2,"mana":150,"range":"20 ft","duration":null,"mech":"shadow · WILL save","desc":"You try to use your magical powers and charisma to force a target’s mind into submission. You ask the creature a question, or tell them to do an action. If the question is sensible and not something the target would particularly try to hide or lie about, or if the action is something normal, that does not directly harm the target, or contradict its will (for example a soldier that was given orders), they must succeed on a will saving throw or answer the question/follow your command. If the qu...","tags":["damage","shadow"]},{"id":"one-with-the-shadows","name":"One with the shadows","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":5,"ap":3,"mana":300,"range":null,"duration":"1 min","mech":"shadow","desc":"While in the shadows, you gain the following benefits: moving costs no ap, you cannot take surface damage, you halve all incoming damage, have advantage on saving throws against spells that would CC you and you crit on 15 or above attack rolls.","tags":["damage","shadow"]},{"id":"shadow-assault","name":"Shadow assault","classId":"shadow-trickster","cls":"Shadow Trickster","path":"Rogue","level":5,"ap":3,"mana":500,"range":"60 ft","duration":null,"mech":"shadow","desc":"You dash to a creature within range and mark them. This spell casts dark assault (see level 20 feature) instead of having one shadow for one round. If you already have dark assault, all the damage from the shadows is doubled. At
